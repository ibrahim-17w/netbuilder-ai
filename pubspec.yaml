name: net_builder
description: "NetBuilder AI - local-first network builder with Gemini BYOK, memory, GNS3 + Packet Tracer support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.3.7
  crypto: ^3.0.7
  xml: ^7.0.1
  share_plus: ^12.0.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/rule_packs/
    # The offline .pkt template library, extracted by sidecar/pkt_template_build.py
    # from real Packet Tracer saves. This is what lets a phone build a real save
    # with no sidecar: every device model's <DEVICE> block, its port inventory
    # (names Packet Tracer derives from the module layout), one <LINK> block per
    # cable kind, and the global skeleton the topology is written into.
    - assets/pkt_templates/manifest.json
    - assets/pkt_templates/skeleton.xml
    - assets/pkt_templates/devices/
    - assets/pkt_templates/links/
