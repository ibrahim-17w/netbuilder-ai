name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One pin for every job. Keep this in step with .metadata's revision when
  # upgrading Flutter; the version is logged in each job for support reports.
  FLUTTER_VERSION: '3.44.0'

jobs:
  analyze-and-test:
    name: analyze + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Log tool versions
        run: |
          flutter --version
          dart --version
          python3 --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Pilot scorecard tool tests
        run: python3 -m unittest pilot.test_summarize_metrics -v

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos, not --fatal-warnings: the suite's own style guide
      # (analysis_options.yaml) is written to be clean at info level too, and a
      # green analyzer is what lets a reviewer trust the diff.
      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Version contract
        run: flutter test test/version_contract_test.dart

      - name: Test suite
        run: flutter test

      # The golden corpus is the app's behavior contract for real phrasings and
      # advice shapes. Run it as its own named Linux gate so a regression is
      # obvious in the checks list instead of buried in the full suite.
      - name: Golden corpus (Linux)
        run: flutter test test/nlu_golden_set_test.dart test/advisor_golden_test.dart

      - name: Release build (Linux target, proof the bundle assembles)
        run: flutter build linux --release

  windows:
    name: test + build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Log tool versions
        run: |
          flutter --version
          dart --version
          python --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Test suite
        run: flutter test

      - name: Release build
        run: flutter build windows --release

      # A packaged launch is the only thing that proves the DLL set and bundle
      # layout are complete. It runs the real executable, not a widget harness.
      - name: Packaged Windows smoke test
        run: powershell -ExecutionPolicy Bypass -File tool/windows_smoke_test.ps1 -ExePath build/windows/x64/runner/Release/net_builder.exe

  windows-integration:
    name: offline workflow integration test (windows)
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Log tool versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      # Compiles and launches the real Windows runner and drives the offline
      # workflow inside it (describe a network, confirm the layout, build the
      # .pkt, check the file on disk), so the result is platform evidence the
      # widget harness cannot produce. The test name in the output names the
      # platform it ran on.
      - name: Offline workflow integration test
        run: flutter test integration_test -d windows

  windows-package:
    name: signed Windows package (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Log tool versions
        run: |
          flutter --version
          python --version
          Get-Command iexpress.exe | Select-Object -ExpandProperty Source
          Get-Command signtool.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Source

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install engine build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt pyinstaller

      - name: Write signing certificate
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            throw 'WINDOWS_CERT_PFX_BASE64 is not set; a tagged release must be signed.'
          }
          if (-not $env:WINDOWS_CERT_PASSWORD) {
            throw 'WINDOWS_CERT_PASSWORD is not set; a tagged release must be signed.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'netbuilder-signing.pfx'
          [IO.File]::WriteAllBytes(
            $path,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          )
          "NETBUILDER_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV `
            -Append -Encoding utf8

      - name: Build signed installer and portable ZIP
        shell: pwsh
        env:
          NETBUILDER_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File packaging/build_installer.ps1 `
            -SignCertificatePath $env:NETBUILDER_PFX `
            -RequireSignature

      - name: Verify staged bundle, engine identity and signatures
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging/verify_bundle.ps1 -BundleRoot build/tester-installer/payload

      - name: Verify release hashes and signatures
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging/verify_release.ps1 -RequireSigned

      - name: Clean-install test
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging/test_install.ps1

      - name: Upgrade-preserves-data test
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging/test_upgrade.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: netbuilder-windows-package
          path: |
            dist/NetBuilderAI-Tester-Setup.exe
            dist/NetBuilderAI-Tester-Portable.zip
            dist/bundle-manifest.json
            dist/release-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  sidecar:
    name: sidecar pytest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyautogui pywinauto pillow pynput

      # The suite is file-isolated through sidecar/conftest.py, so a shared
      # working tree is safe. Some tests are platform-dependent (the Windows
      # autopilot and the OCR golden), so deselect nothing here and let the
      # markers do the work - a failure to import or collect is what this job
      # exists to catch.
      - name: Test suite
        working-directory: sidecar
        run: python -m pytest -q

  sidecar-windows:
    name: sidecar pytest (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Log tool versions
        run: python --version

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyautogui pywinauto pillow pynput

      - name: Test suite
        working-directory: sidecar
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q

  android-debug:
    name: android debug APK (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netbuilder-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: android signed release APK (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Write signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a tagged release must be signed."
            exit 1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Release keystore alias/passwords are not configured."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build signed release APK
        run: |
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: netbuilder-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
